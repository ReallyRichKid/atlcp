<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALTCP — неоновый стиль</title>
  <style>
    /* Сброс стилей */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }

    /* Неоновое свечение на фоне (пурпур) */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(180, 0, 255, 0.18), transparent 55%),
                  radial-gradient(circle at 80% 70%, rgba(255, 0, 200, 0.15), transparent 60%),
                  radial-gradient(circle at 50% 100%, rgba(140, 0, 255, 0.12), transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 2;
      max-width: 720px;
      width: 100%;
      background: rgba(12, 8, 20, 0.82);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(190, 70, 255, 0.5);
      border-radius: 3rem 1rem 3rem 1rem;
      padding: 3rem 2rem 2.5rem;
      box-shadow: 
        0 0 40px rgba(170, 0, 255, 0.5),
        0 0 80px rgba(140, 0, 200, 0.25),
        inset 0 0 40px rgba(180, 0, 255, 0.2);
      transition: box-shadow 0.25s ease;
      text-align: center;
    }

    .card:hover {
      box-shadow: 
        0 0 60px rgba(200, 0, 255, 0.8),
        0 0 120px rgba(160, 0, 240, 0.4),
        inset 0 0 60px rgba(190, 0, 255, 0.35);
    }

    /* Заголовок ALTCP */
    .title {
      font-size: clamp(3rem, 15vw, 5.5rem);
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 
        0 0 8px #fff,
        0 0 20px #f0f,
        0 0 40px #c0f,
        0 0 70px #a0f,
        0 0 100px #80f;
      animation: pulse 1.6s infinite alternate ease-in-out;
      margin-bottom: 0.5rem;
      line-height: 1.1;
      word-break: break-word;
    }

    @keyframes pulse {
      0% {
        text-shadow: 
          0 0 6px #fff,
          0 0 18px #f0f,
          0 0 35px #c0f,
          0 0 60px #a0f,
          0 0 90px #80f;
      }
      100% {
        text-shadow: 
          0 0 12px #fff,
          0 0 30px #f4f,
          0 0 60px #d0f,
          0 0 100px #b0f,
          0 0 140px #90f;
      }
    }

    /* === ДВА СТОЛБИКА С ОПИСАНИЕМ === */
    .description-columns {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 1.5rem;
      margin: 2rem 0 2.2rem;
      padding: 0 0.5rem;
    }

    .desc-col {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 0.8rem;
      border-radius: 1rem;
      background: rgba(120, 0, 200, 0.08);
      border: 1px solid rgba(190, 70, 255, 0.25);
      box-shadow: inset 0 0 20px rgba(160, 0, 255, 0.15);
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .desc-col:hover {
      border-color: rgba(220, 120, 255, 0.6);
      box-shadow: inset 0 0 30px rgba(190, 0, 255, 0.3), 0 0 20px rgba(170, 0, 255, 0.3);
    }

    /* Неоновый разделитель между столбцами */
    .divider {
      flex: 0 0 2px;
      align-self: stretch;
      background: linear-gradient(180deg, transparent, #c04cff, #ff80ff, #c04cff, transparent);
      filter: blur(1px);
      border-radius: 100%;
      box-shadow: 0 0 12px #b040ff, 0 0 25px #8000ff;
      opacity: 0.9;
    }

    .desc-ru, .desc-en {
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 1.5;
      color: #f0e6ff;
      text-align: center;
      text-shadow: 0 0 8px rgba(200, 0, 255, 0.9), 0 0 16px rgba(150, 0, 255, 0.6);
      transition: text-shadow 0.3s;
    }

    .desc-en {
      font-size: 1.05rem;
      color: #e6d0ff;
      text-shadow: 0 0 6px rgba(180, 0, 255, 0.9), 0 0 14px rgba(130, 0, 220, 0.7);
    }

    .desc-ru:hover, .desc-en:hover {
      text-shadow: 0 0 14px #ffb0ff, 0 0 28px #c040ff, 0 0 45px #8000ff;
    }

    /* Кнопка TG CHANNEL */
    .tg-button {
      display: inline-block;
      background: transparent;
      border: 2.5px solid #b73cff;
      border-radius: 60px;
      padding: 1.2rem 3.5rem;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
      text-shadow: 0 0 10px #e0a0ff, 0 0 25px #b040ff, 0 0 45px #8000ff;
      box-shadow: 
        0 0 25px rgba(190, 0, 255, 0.8),
        0 0 45px rgba(140, 0, 200, 0.5),
        inset 0 0 20px rgba(200, 80, 255, 0.4);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      backdrop-filter: blur(4px);
      margin-top: 0.5rem;
      animation: buttonGlow 2s infinite alternate;
    }

    .tg-button:hover {
      background: rgba(160, 0, 255, 0.25);
      border-color: #f0a0ff;
      box-shadow: 
        0 0 45px #c040ff,
        0 0 80px #a020ff,
        0 0 120px #8000ff,
        inset 0 0 35px #b000ff;
      text-shadow: 0 0 20px #fff, 0 0 40px #e060ff, 0 0 70px #b000ff;
      transform: scale(1.02);
      color: #ffffff;
    }

    .tg-button:active {
      transform: scale(0.98);
      box-shadow: 0 0 30px #b000ff, 0 0 60px #8000ff;
    }

    @keyframes buttonGlow {
      0% {
        box-shadow: 
          0 0 20px rgba(190, 0, 255, 0.7),
          0 0 35px rgba(150, 0, 220, 0.4),
          inset 0 0 15px rgba(200, 70, 255, 0.3);
      }
      100% {
        box-shadow: 
          0 0 40px rgba(210, 0, 255, 1),
          0 0 70px rgba(180, 0, 250, 0.7),
          inset 0 0 30px rgba(220, 100, 255, 0.6);
      }
    }

    /* Декоративная линия снизу */
    .card::after {
      content: '';
      position: absolute;
      bottom: 15px;
      left: 20%;
      width: 60%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c04cff, #ff80ff, #c04cff, transparent);
      filter: blur(2px);
      opacity: 0.7;
      border-radius: 100%;
    }

    /* Адаптивность: на узких экранах столбики складываются вертикально */
    @media (max-width: 560px) {
      .description-columns {
        flex-direction: column;
        gap: 0.9rem;
      }

      .divider {
        flex: 0 0 2px;
        width: 60%;
        height: 2px;
        align-self: center;
        background: linear-gradient(90deg, transparent, #c04cff, #ff80ff, #c04cff, transparent);
      }
    }

    @media (max-width: 500px) {
      .card {
        padding: 2rem 1.2rem 2rem;
        border-radius: 2rem 0.8rem 2rem 0.8rem;
      }

      .desc-ru {
        font-size: 1rem;
      }

      .desc-en {
        font-size: 0.9rem;
      }

      .tg-button {
        font-size: 1.2rem;
        padding: 1rem 1.8rem;
        letter-spacing: 0.15em;
      }

      .title {
        letter-spacing: 0.05em;
      }
    }

    @media (max-width: 350px) {
      .tg-button {
        font-size: 1rem;
        padding: 0.9rem 1.2rem;
        letter-spacing: 0.1em;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">ALTCP</h1>

    <div class="description-columns">
      <div class="desc-col">
        <div class="desc-ru">Актуальная ссылка на TG по кнопке ниже</div>
      </div>
      <div class="divider"></div>
      <div class="desc-col">
        <div class="desc-en">Actual link to TG via the button below</div>
      </div>
    </div>

    <a href="https://telegra.ph/Actual-Linl-11-14" target="_blank" rel="noopener noreferrer" class="tg-button">TG CHANNEL</a>
  </div>
</body>
</html>
